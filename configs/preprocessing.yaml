data_sources:
  train: "data/raw/train.csv"
  test: "data/raw/test.csv"
  stores: "data/raw/stores.csv"
  oil: "data/raw/oil.csv"
  holidays: "data/raw/holidays_events.csv"
  transactions: "data/raw/transactions.csv"

pipeline_steps:
  - name: "store_metadata"
    class: "src.features.meta.StoreMerger"
    params:
      stores_path: "data/raw/stores.csv"

  - name: "oil_prices"
    class: "src.features.meta.OilMerger"
    params:
      oil_path: "data/raw/oil.csv"
      method: "linear"

  - name: "transactions"
    class: "src.features.transactions.TransactionMerger"
    params:
      transactions_path: "data/raw/transactions.csv"
      fill_value: 0.0

  - name: "calendar_features"
    class: "src.features.dates.DatePartTransformer"
    params:
      parts: ["month", "dayofweek", "is_month_end", "is_wage_day", "time_idx"]
      column: "date"

  - name: "holidays"
    class: "src.features.holidays.HolidayTransformer"
    params:
      holidays_path: "data/raw/holidays_events.csv"
      stores_path: "data/raw/stores.csv"

  - name: "final_imputer"
    class: "src.features.imputation.ConfigurableImputer"
    params:
      strategies:
        "holiday_type": {"method": "fill", "value": "WorkDay"}
        "is_holiday": {"method": "fill", "value": False}
