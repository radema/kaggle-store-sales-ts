model:
  hidden_dim: 32
  heads: 1
  alpha: 0.01 # L1 sparsity weight
  window: 30
  horizon: 16

training:
  epochs: 200
  batch_size: 32
  lr: 0.003
  patience: 5
  val_days: 16 # Use last horizon days for validation

data:
  train_start: "2017-01-01" # Full history
  features:
    - "onpromotion"
    - "dcoilwtico"
    - "is_nat_holiday"
    - "is_reg_holiday"
    - "is_loc_holiday"
    - "sin_day_year"
    - "cos_day_year"
    - "dayofweek"
    - "is_wage_day"
    - "rolling_30_sales"
    - "lag_7"
    - "lag_14"
    - "lag_21"
    - "lag_28"
